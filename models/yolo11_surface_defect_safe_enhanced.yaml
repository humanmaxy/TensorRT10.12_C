# Safe Enhanced YOLO11 for Surface Defect Detection
# 稳定的增强版本，避免复杂参数配置问题

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# 安全的增强Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 1, SEAttention, []]                     # 2 - SE注意力
  - [-1, 2, C3k2, [256, False, 0.25]]            # 3
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 5
  - [-1, 1, ECA, []]                             # 6 - ECA注意力
  - [-1, 1, Conv, [512, 3, 2]]                   # 7-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 8
  - [-1, 1, CBAM, []]                            # 9 - CBAM注意力
  - [-1, 1, Conv, [1024, 3, 2]]                  # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 11
  - [-1, 1, SEAttention, []]                     # 12 - SE注意力
  - [-1, 1, SPPF, [1024, 5]]                     # 13
  - [-1, 2, C2PSA, [1024]]                       # 14

# 安全的增强Head
head:
  # P4分支
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]                    # cat backbone P4 (带CBAM)
  - [-1, 2, C3k2, [512, False]]                  # 17 (P4)
  - [-1, 1, ECA, []]                             # 18 - ECA注意力

  # P3分支  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                    # cat backbone P3 (带ECA)
  - [-1, 2, C3k2, [256, False]]                  # 21 (P3)
  - [-1, 1, CBAM, []]                            # 22 - CBAM注意力

  # P2分支 - 小目标检测关键
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]                    # cat backbone P2 (带SE)
  - [-1, 2, C3k2, [128, False]]                  # 25 (P2/4)
  - [-1, 1, SEAttention, []]                     # 26 - SE注意力强化小目标

  # 重建金字塔
  - [-1, 1, Conv, [128, 3, 2]]                   # 27
  - [[-1, 22], 1, Concat, [1]]                   # 28
  - [-1, 2, C3k2, [256, False]]                  # 29 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                   # 30
  - [[-1, 18], 1, Concat, [1]]                   # 31
  - [-1, 2, C3k2, [512, False]]                  # 32 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                   # 33
  - [[-1, 14], 1, Concat, [1]]                   # 34
  - [-1, 2, C3k2, [1024, True]]                  # 35 (P5/32)

  # 检测头
  - [[26, 29, 32, 35], 1, Detect, [nc]]          # 36 - Detect(P2, P3, P4, P5)