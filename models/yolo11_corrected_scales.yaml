# YOLO11 with Corrected Scales - 修正scales配置
# 使用正确的scales避免通道数计算错误
# 保留四大核心模块: MicroDefectHead, SnakeConv, BiFPNSimple, EnhancedC2f

nc: 5  # 缺陷类别数

# 修正的scales配置 - 避免自动调整导致的通道数错误
scales:  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]   # 减少depth避免层数过多
  s: [0.33, 0.50, 1024]   # 减少depth，保持width
  m: [0.67, 0.75, 768]    # 适中的配置
  l: [1.00, 1.00, 512]    # 标准配置
  x: [1.33, 1.25, 512]    # 稍微增加

# 固定通道数的backbone - 避免自动缩放问题
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2 (固定64通道)
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4 (固定128通道)
  
  # Stage 1: 小目标增强 - 微缺陷检测准备
  - [-1, 1, SmallObjectAttention, []]            # 2 - 自适应注意力
  - [-1, 2, C2f, [128, 256]]                     # 3 (固定256通道)
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8 (固定256通道)
  
  # Stage 2: 中等目标 - 蛇形卷积集成
  - [-1, 2, EnhancedC2f, [256, 512]]             # 5 - 增强C2f（功能2：蛇形卷积）
  - [-1, 1, Conv, [512, 3, 2]]                   # 6-P4/16 (固定512通道)
  
  # Stage 3: 大目标 - BiFPN特征融合
  - [-1, 1, BiFPNSimple, [512, 512]]             # 7 - 简化BiFPN（功能3）
  - [-1, 2, C2f, [512, 512]]                     # 8 (保持512通道)
  - [-1, 1, Conv, [512, 3, 2]]                   # 9-P5/32 (固定512通道)
  
  # Stage 4: 高级特征
  - [-1, 2, C2f, [512, 1024]]                    # 10 (固定1024通道)
  - [-1, 1, SPPF, [1024, 1024]]                  # 11 (保持1024通道)

# 固定通道数的head - 专用微缺陷检测（功能1）
head:
  # 标准自顶向下路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 8], 1, Concat, [1]]                    # 13 - cat P4 (1024+512=1536)
  - [-1, 2, C2f, [1536, 512]]                    # 14 (P4/16) 输出固定512
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 5], 1, Concat, [1]]                    # 16 - cat P3 (512+512=1024)
  - [-1, 2, C2f, [1024, 256]]                    # 17 (P3/8) 输出固定256
  
  # P2分支 - 专用微缺陷检测头（功能1）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 3], 1, Concat, [1]]                    # 19 - cat P2 (256+256=512)
  - [-1, 1, MicroDefectHead, [512, 256]]         # 20 - 专用微缺陷检测头（功能1）
  - [-1, 2, C2f, [256, 128]]                     # 21 (P2/4) 输出固定128
  
  # P1分支 - 超高分辨率微缺陷检测（15微米级别）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 22 - P1/2层
  - [-1, 1, MicroDefectHead, [128, 64]]          # 23 - P1层微缺陷检测（功能1）
  - [-1, 1, C2f, [64, 64]]                       # 24 (P1/2) 输出固定64
  
  # 自底向上路径重建
  - [-1, 1, Conv, [64, 3, 2]]                    # 25 - P1 to P2 (64->64)
  - [[-1, 21], 1, Concat, [1]]                   # 26 - (64+128=192)
  - [-1, 2, C2f, [192, 128]]                     # 27 (P2/4) 输出固定128
  
  - [-1, 1, Conv, [128, 3, 2]]                   # 28 - P2 to P3 (128->128)
  - [[-1, 17], 1, Concat, [1]]                   # 29 - (128+256=384)
  - [-1, 2, C2f, [384, 256]]                     # 30 (P3/8) 输出固定256
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 31 - P3 to P4 (256->256)
  - [[-1, 14], 1, Concat, [1]]                   # 32 - (256+512=768)
  - [-1, 2, C2f, [768, 512]]                     # 33 (P4/16) 输出固定512
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 34 - P4 to P5 (512->512)
  - [[-1, 11], 1, Concat, [1]]                   # 35 - (512+1024=1536)
  - [-1, 2, C2f, [1536, 1024]]                   # 36 (P5/32) 输出固定1024

  # 五尺度检测头 - 包含P1超高分辨率检测
  - [[24, 27, 30, 33, 36], 1, Detect, [nc]]      # 37 - 五尺度检测