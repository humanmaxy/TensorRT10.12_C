# Standard YOLO11 with P1/2 + P2/4 output for ultra-small defect detection
# 基于P2特征的基础上增加P1特征，使用标准模块提升微小目标检测能力
# 不依赖自定义模块，保持标准YOLO架构兼容性

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Standard Backbone - 保持原始架构稳定性
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2 (保留P1特征)
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]       # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10

# Enhanced Head with P1/2 + P2/4 + P3/8 + P4/16 + P5/32 multi-scale detection
head:
  # P4分支开始
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13 (P4)

  # P3分支  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16 (P3)

  # P2分支 - 小目标检测关键层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 2], 1, Concat, [1]]                    # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]]                  # 19 (P2/4) - 小目标特征提取
  - [-1, 1, Conv, [128, 1, 1]]                   # 20 - 特征优化

  # P1分支 - 超小目标检测核心层  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 21
  - [[-1, 0], 1, Concat, [1]]                    # 22 cat backbone P1
  - [-1, 2, C3k2, [64, False]]                   # 23 (P1/2) - 超小目标特征提取
  - [-1, 1, Conv, [64, 3, 1]]                    # 24 - 进一步特征增强
  - [-1, 1, Conv, [64, 1, 1]]                    # 25 - 特征优化

  # 重建特征金字塔 - 从P1开始逐级融合
  - [-1, 1, Conv, [64, 3, 2]]                    # 26 从P1到P2
  - [[-1, 20], 1, Concat, [1]]                   # 27 融合P2特征
  - [-1, 2, C3k2, [128, False]]                  # 28 (P2/4 融合)

  - [-1, 1, Conv, [128, 3, 2]]                   # 29 从P2到P3
  - [[-1, 16], 1, Concat, [1]]                   # 30 融合P3特征
  - [-1, 2, C3k2, [256, False]]                  # 31 (P3/8 融合)

  - [-1, 1, Conv, [256, 3, 2]]                   # 32 从P3到P4
  - [[-1, 13], 1, Concat, [1]]                   # 33 融合P4特征
  - [-1, 2, C3k2, [512, False]]                  # 34 (P4/16 融合)

  - [-1, 1, Conv, [512, 3, 2]]                   # 35 从P4到P5
  - [[-1, 10], 1, Concat, [1]]                   # 36 融合P5特征
  - [-1, 2, C3k2, [1024, True]]                  # 37 (P5/32 融合)

  # 五尺度检测头 - P1超小, P2小, P3中小, P4中, P5大
  - [[25, 28, 31, 34, 37], 1, Detect, [nc]]      # 38 - 五尺度检测 (P1, P2, P3, P4, P5)