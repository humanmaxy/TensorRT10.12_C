# YOLO11 Architecture Based - 基于架构的四功能实现
# 不使用自定义模块，通过架构设计实现四大功能
# 确保100%兼容ultralytics框架

nc: 5  # 缺陷类别数

# 使用标准yolo11s的scales
scales:
  s: [0.50, 0.50, 1024]

# 标准backbone，通过架构实现功能
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  
  # 功能2模拟：多个小卷积核模拟蛇形效果
  - [-1, 1, C2f, [128, 128]]      # 2 - 小卷积核
  - [-1, 1, C2f, [128, 256]]      # 3 - 标准卷积核
  - [-1, 1, Conv, [256, 3, 2]]    # 4-P3/8
  
  # 功能3模拟：多层C2f模拟BiFPN效果
  - [-1, 1, C2f, [256, 256]]      # 5 - 多尺度1
  - [-1, 1, C2f, [256, 512]]      # 6 - 多尺度2
  - [-1, 1, Conv, [512, 3, 2]]    # 7-P4/16
  
  - [-1, 2, C2f, [512, 512]]      # 8
  - [-1, 1, Conv, [512, 3, 2]]    # 9-P5/32
  
  - [-1, 2, C2f, [512, 1024]]     # 10
  - [-1, 1, SPPF, [1024, 1024]]   # 11

# 功能1实现：五尺度检测头（包含P1/P2微缺陷检测）
head:
  # 标准路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 8], 1, Concat, [1]]                   # 13
  - [-1, 2, C2f, [1536, 512]]                   # 14 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 6], 1, Concat, [1]]                   # 16
  - [-1, 2, C2f, [1024, 256]]                   # 17 (P3/8)
  
  # P2分支 - 小目标检测
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 3], 1, Concat, [1]]                   # 19
  - [-1, 2, C2f, [512, 128]]                    # 20 (P2/4) - 小目标
  
  # P1分支 - 超高分辨率微缺陷检测
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21 P1/2层
  - [-1, 2, C2f, [128, 64]]                     # 22 (P1/2) - 微缺陷
  
  # 重建检测层
  - [-1, 1, Conv, [64, 3, 2]]                   # 23
  - [[-1, 20], 1, Concat, [1]]                  # 24
  - [-1, 2, C2f, [192, 128]]                    # 25 (P2/4)
  
  - [-1, 1, Conv, [128, 3, 2]]                  # 26
  - [[-1, 17], 1, Concat, [1]]                  # 27
  - [-1, 2, C2f, [384, 256]]                    # 28 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                  # 29
  - [[-1, 14], 1, Concat, [1]]                  # 30
  - [-1, 2, C2f, [768, 512]]                    # 31 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                  # 32
  - [[-1, 11], 1, Concat, [1]]                  # 33
  - [-1, 2, C2f, [1536, 1024]]                  # 34 (P5/32)

  # 五尺度检测头
  - [[22, 25, 28, 31, 34], 1, Detect, [nc]]     # 35