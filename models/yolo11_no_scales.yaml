# YOLO11 No Scales - 移除scales配置
# 避免自动缩放导致的通道数问题
# 保留四大核心模块: MicroDefectHead, SnakeConv, BiFPNSimple, EnhancedC2f

nc: 5  # 缺陷类别数

# 不使用scales配置，避免自动调整

# 固定架构backbone - 不受scales影响
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  
  # Stage 1: 小目标增强
  - [-1, 1, SmallObjectAttention, []]            # 2 - 自适应注意力
  - [-1, 2, C2f, [128, 256]]                     # 3
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  
  # Stage 2: 蛇形卷积集成
  - [-1, 2, EnhancedC2f, [256, 512]]             # 5 - 增强C2f（蛇形卷积）
  - [-1, 1, Conv, [512, 3, 2]]                   # 6-P4/16
  
  # Stage 3: BiFPN特征融合
  - [-1, 1, BiFPNSimple, [512, 512]]             # 7 - 简化BiFPN
  - [-1, 2, C2f, [512, 512]]                     # 8
  - [-1, 1, Conv, [512, 3, 2]]                   # 9-P5/32
  
  # Stage 4: 高级特征
  - [-1, 2, C2f, [512, 1024]]                    # 10
  - [-1, 1, SPPF, [1024, 1024]]                  # 11

# 专用微缺陷检测head
head:
  # 自顶向下路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 8], 1, Concat, [1]]                    # 13 - cat P4
  - [-1, 2, C2f, [1536, 512]]                    # 14 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 5], 1, Concat, [1]]                    # 16 - cat P3
  - [-1, 2, C2f, [1024, 256]]                    # 17 (P3/8)
  
  # P2分支 - 专用微缺陷检测头
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 3], 1, Concat, [1]]                    # 19 - cat P2
  - [-1, 1, MicroDefectHead, [512, 256]]         # 20 - 微缺陷检测头
  - [-1, 2, C2f, [256, 128]]                     # 21 (P2/4)
  
  # P1分支 - 超高分辨率检测（15微米级别）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 22 - P1/2层
  - [-1, 1, MicroDefectHead, [128, 64]]          # 23 - P1层微缺陷检测
  - [-1, 1, C2f, [64, 64]]                       # 24 (P1/2)
  
  # 自底向上路径
  - [-1, 1, Conv, [64, 3, 2]]                    # 25
  - [[-1, 21], 1, Concat, [1]]                   # 26
  - [-1, 2, C2f, [192, 128]]                     # 27 (P2/4)
  
  - [-1, 1, Conv, [128, 3, 2]]                   # 28
  - [[-1, 17], 1, Concat, [1]]                   # 29
  - [-1, 2, C2f, [384, 256]]                     # 30 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 31
  - [[-1, 14], 1, Concat, [1]]                   # 32
  - [-1, 2, C2f, [768, 512]]                     # 33 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 34
  - [[-1, 11], 1, Concat, [1]]                   # 35
  - [-1, 2, C2f, [1536, 1024]]                   # 36 (P5/32)

  # 五尺度检测头
  - [[24, 27, 30, 33, 36], 1, Detect, [nc]]      # 37