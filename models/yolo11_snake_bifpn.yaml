# YOLO11 with Snake Deformable Conv + BiFPN
# 集成蛇形可变形卷积和BiFPN的YOLO11配置
# 专门用于X光焊缝小目标检测

# Parameters
nc: 5  # 缺陷类别数
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.25, 1.25, 512]

# 创新主干网络 - Snake Conv + BiFPN集成
backbone:
  # [from, repeats, module, args]
  
  # Stem - 基础特征提取
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  
  # Stage 1: 小目标特征增强 - 蛇形卷积
  - [-1, 1, SEAttention, []]                     # 2 - SE注意力
  - [-1, 2, C3k2_SnakeDeformable, [128, 256]]    # 3 - 蛇形可变形卷积 [c1, c2]
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  
  # Stage 2: 中等目标 - BiFPN融合
  - [-1, 1, BiFPNBlock, [256, 512]]              # 5 - BiFPN块 [c1, c2]
  - [-1, 2, C3k2_Enhanced, [512, 512, False, 1, 0.5, 'cbam']] # 6 - CBAM增强
  - [-1, 1, Conv, [512, 3, 2]]                   # 7-P4/16
  
  # Stage 3: 大目标 - 蛇形+BiFPN组合
  - [-1, 1, TripleBiFPN, [512, 512]]             # 8 - 三阶BiFPN [c1, c2]
  - [-1, 2, C3k2_SnakeDeformable, [512, 512]]    # 9 - 蛇形增强 [c1, c2]
  - [-1, 1, CBAM, []]                            # 10 - CBAM注意力
  - [-1, 1, Conv, [1024, 3, 2]]                  # 11-P5/32
  
  # Stage 4: 高级特征融合
  - [-1, 2, C3k2_Enhanced, [1024, 1024, True, 1, 0.5, 'se']] # 12 - SE增强
  - [-1, 1, SPP_Enhanced, [1024, 1024]]          # 13 - 增强SPP
  - [-1, 1, MultiScaleBiFPN, [[1024], 1024]]     # 14 - 多尺度BiFPN
  - [-1, 2, C2PSA, [1024]]                       # 15 - PSA注意力

# 增强检测头 - BiFPN + 微缺陷检测
head:
  # 自顶向下特征融合 - BiFPN Top-Down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 10], 1, Concat, [1]]                   # 17 - cat P4 (CBAM特征)
  - [-1, 1, BiFPNLayer, [1536, 3]]               # 18 - BiFPN层融合 [channels, num_levels]
  - [-1, 2, C3k2_SnakeDeformable, [1536, 512]]   # 19 (P4) - 蛇形增强 [c1, c2]
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 20  
  - [[-1, 6], 1, Concat, [1]]                    # 21 - cat P3 (CBAM特征)
  - [-1, 1, TripleBiFPN, [1024, 256]]            # 22 - 三阶BiFPN [c1, c2]
  - [-1, 2, C3k2_Enhanced, [256, 256, False, 1, 0.5, 'se']] # 23 (P3) - SE增强
  
  # P2分支 - 微小目标关键层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 24
  - [[-1, 3], 1, Concat, [1]]                    # 25 - cat P2 (蛇形特征)
  - [-1, 1, MultiScaleBiFPN, [[512], 128]]       # 26 - 多尺度BiFPN [feature_channels, out_channels]
  - [-1, 2, C3k2_SnakeDeformable, [128, 128]]    # 27 (P2/4) - 蛇形微目标增强 [c1, c2]
  - [-1, 1, MicroDefectAttention, [128]]         # 28 - 微缺陷注意力 [channels]
  
  # 自底向上路径重建 - BiFPN Bottom-Up  
  - [-1, 1, Conv, [128, 3, 2]]                   # 29
  - [[-1, 23], 1, Concat, [1]]                   # 30
  - [-1, 1, BiFPNLayer, [384, 3]]                # 31 - BiFPN双向融合 [channels, num_levels]
  - [-1, 2, C3k2_Enhanced, [384, 256, False, 1, 0.5, 'eca']] # 32 (P3/8) - ECA增强
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 33  
  - [[-1, 19], 1, Concat, [1]]                   # 34
  - [-1, 1, TripleBiFPN, [768, 512]]             # 35 - 三阶BiFPN [c1, c2]
  - [-1, 2, C3k2_SnakeDeformable, [512, 512]]    # 36 (P4/16) - 蛇形增强 [c1, c2]
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 37
  - [[-1, 15], 1, Concat, [1]]                   # 38  
  - [-1, 1, MultiScaleBiFPN, [[1536], 1024]]     # 39 - 多尺度最终融合 [feature_channels, out_channels]
  - [-1, 2, C3k2_Enhanced, [1024, 1024, True, 1, 0.5, 'cbam']] # 40 (P5/32) - CBAM最终增强

  # 四尺度检测头 - 集成微缺陷检测能力
  - [[28, 32, 36, 40], 1, EnhancedDetectHead, [nc]] # 41 - 增强检测头

# 模块参数配置
module_configs:
  snake_deformable_conv:
    snake_alpha: 0.1              # 蛇形约束强度
    adaptive_weight: true         # 自适应权重
    deform_groups: 1              # 可变形组数
    
  bifpn:
    num_layers: 3                 # BiFPN层数
    eps: 0.0001                   # 数值稳定性
    fast_fusion: true             # 快速融合
    
  micro_defect_head:
    detection_limit: "15微米"      # 检测下限
    sub_pixel_scale: 2            # 亚像素缩放
    micro_threshold: 0.1          # 微缺陷面积阈值
    
  attention_mechanisms:
    se_reduction: 16              # SE注意力降维比例
    cbam_reduction: 16            # CBAM降维比例
    eca_gamma: 2                  # ECA参数