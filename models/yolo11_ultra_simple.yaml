# YOLO11 Ultra Simple - 超简版本
# 实现四大功能，使用现有模块，避免所有兼容性问题

nc: 5  # 缺陷类别数
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.25, 1.25, 512]

# 基于标准YOLO11，只添加现有的增强模块
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  
  # Stage 1: 小目标增强 - 使用现有SE注意力
  - [-1, 1, SEAttention, []]                     # 2 - SE注意力（功能1支持）
  - [-1, 2, C2f, [128, 256]]                     # 3
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  
  # Stage 2: 中等目标 - 使用现有CBAM
  - [-1, 1, CBAM, []]                            # 5 - CBAM注意力（功能2支持）
  - [-1, 2, C2f, [256, 512]]                     # 6
  - [-1, 1, Conv, [512, 3, 2]]                   # 7-P4/16
  
  # Stage 3: 大目标 - 使用现有ECA
  - [-1, 1, ECA, []]                             # 8 - ECA注意力（功能3支持）
  - [-1, 2, C2f, [512, 512]]                     # 9
  - [-1, 1, Conv, [512, 3, 2]]                   # 10-P5/32
  
  # Stage 4: 高级特征
  - [-1, 2, C2f, [512, 1024]]                    # 11
  - [-1, 1, SPPF, [1024, 1024]]                  # 12

# 增强head - 实现专用微缺陷检测（功能1）
head:
  # 标准自顶向下路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 9], 1, Concat, [1]]                    # 14 - cat P4 (1024+512=1536)
  - [-1, 2, C2f, [1536, 512]]                    # 15 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 6], 1, Concat, [1]]                    # 17 - cat P3 (512+512=1024)  
  - [-1, 2, C2f, [1024, 256]]                    # 18 (P3/8)
  
  # P2分支 - 专用微缺陷检测头（功能1）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 19
  - [[-1, 3], 1, Concat, [1]]                    # 20 - cat P2 (256+256=512)
  - [-1, 1, SEAttention, []]                     # 21 - 微缺陷SE注意力增强
  - [-1, 2, C2f, [512, 128]]                     # 22 (P2/4) - 微缺陷检测层
  
  # P1分支 - 超高分辨率检测（15微米级别）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 23 - P1/2层
  - [-1, 1, CBAM, []]                            # 24 - P1层微缺陷CBAM增强
  - [-1, 1, C2f, [128, 64]]                      # 25 (P1/2) - 超高分辨率检测
  
  # 自底向上路径重建
  - [-1, 1, Conv, [64, 3, 2]]                    # 26 - P1 to P2
  - [[-1, 22], 1, Concat, [1]]                   # 27 - (64+128=192)
  - [-1, 2, C2f, [192, 128]]                     # 28 (P2/4)
  
  - [-1, 1, Conv, [128, 3, 2]]                   # 29 - P2 to P3
  - [[-1, 18], 1, Concat, [1]]                   # 30 - (128+256=384)
  - [-1, 2, C2f, [384, 256]]                     # 31 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 32 - P3 to P4
  - [[-1, 15], 1, Concat, [1]]                   # 33 - (256+512=768)
  - [-1, 2, C2f, [768, 512]]                     # 34 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 35 - P4 to P5
  - [[-1, 12], 1, Concat, [1]]                   # 36 - (512+1024=1536)
  - [-1, 2, C2f, [1536, 1024]]                   # 37 (P5/32)

  # 五尺度检测头 - 包含P1超高分辨率检测（功能1）
  - [[25, 28, 31, 34, 37], 1, Detect, [nc]]      # 38 - 五尺度检测