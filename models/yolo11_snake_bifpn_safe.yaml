# YOLO11 with Snake Deformable Conv + BiFPN - Safe Version
# 安全版本 - 避免尺寸不匹配问题
# 基于标准YOLO11结构，谨慎集成创新模块

# Parameters
nc: 5  # 缺陷类别数
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.25, 1.25, 512]

# 安全的主干网络 - 基于标准YOLO11，谨慎添加创新模块
backbone:
  # [from, repeats, module, args]
  
  # Stem - 标准特征提取
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  
  # Stage 1: 小目标层 - 添加SE注意力
  - [-1, 1, SEAttention, []]                     # 2 - SE注意力增强
  - [-1, 2, C2f, [128, 256]]                     # 3 - 使用标准C2f
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  
  # Stage 2: 中等目标 - 谨慎集成蛇形卷积
  - [-1, 1, C3k2_SnakeDeformable, [256, 256]]    # 5 - 蛇形卷积（相同通道数）
  - [-1, 2, C2f, [256, 512]]                     # 6 - 标准C2f
  - [-1, 1, Conv, [512, 3, 2]]                   # 7-P4/16
  
  # Stage 3: 大目标 - 添加CBAM注意力
  - [-1, 1, CBAM, []]                            # 8 - CBAM注意力
  - [-1, 2, C2f, [512, 512]]                     # 9 - 标准C2f
  - [-1, 1, Conv, [512, 3, 2]]                   # 10-P5/32
  
  # Stage 4: 高级特征 - 标准结构
  - [-1, 2, C2f, [512, 1024]]                    # 11 - 标准C2f
  - [-1, 1, SPPF, [1024, 1024]]                  # 12 - 标准SPPF

# 安全的检测头 - 基于标准YOLO结构
head:
  # 自顶向下路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 8], 1, Concat, [1]]                    # 14 - cat P4 (1024 + 512 = 1536)
  - [-1, 2, C2f, [1536, 512]]                    # 15 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 6], 1, Concat, [1]]                    # 17 - cat P3 (512 + 512 = 1024)
  - [-1, 2, C2f, [1024, 256]]                    # 18 (P3/8)
  
  # 添加P2层用于小目标检测
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 19
  - [[-1, 3], 1, Concat, [1]]                    # 20 - cat P2 (256 + 256 = 512)
  - [-1, 2, C2f, [512, 128]]                     # 21 (P2/4) - 小目标层
  - [-1, 1, MicroDefectAttention, [128]]         # 22 - 微缺陷注意力
  
  # 自底向上路径重建
  - [-1, 1, Conv, [128, 3, 2]]                   # 23
  - [[-1, 18], 1, Concat, [1]]                   # 24 - (128 + 256 = 384)
  - [-1, 2, C2f, [384, 256]]                     # 25 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 26
  - [[-1, 15], 1, Concat, [1]]                   # 27 - (256 + 512 = 768)
  - [-1, 2, C2f, [768, 512]]                     # 28 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 29
  - [[-1, 12], 1, Concat, [1]]                   # 30 - (512 + 1024 = 1536)
  - [-1, 2, C2f, [1536, 1024]]                   # 31 (P5/32)

  # 四尺度检测头 - 包含P2小目标检测
  - [[22, 25, 28, 31], 1, Detect, [nc]]          # 32 - 四尺度检测头