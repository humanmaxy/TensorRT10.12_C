# YOLO11 Standard Scales - 使用标准scales配置
# 基于YOLO11官方scales，避免通道数计算错误
# 保留四大核心模块: MicroDefectHead, SnakeConv, BiFPNSimple, EnhancedC2f

nc: 5  # 缺陷类别数

# 标准YOLO11 scales配置
scales:
  # YOLOv11n
  n: [0.50, 0.25, 1024]  # [depth, width, max_channels]
  # YOLOv11s  
  s: [0.50, 0.50, 1024]
  # YOLOv11m
  m: [0.50, 1.00, 512]
  # YOLOv11l
  l: [1.00, 1.00, 512]
  # YOLOv11x
  x: [1.00, 1.50, 512]

# 使用标准YOLO11n架构作为基础
backbone:
  # [from, repeats, module, args] - 基于yolo11n.yaml
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  
  # 添加小目标注意力
  - [-1, 1, SmallObjectAttention, []]            # 2 - 小目标注意力
  - [-1, 2, C2f, [128, 256]]                     # 3
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  
  # 集成蛇形卷积
  - [-1, 2, EnhancedC2f, [256, 512]]             # 5 - 蛇形卷积集成
  - [-1, 1, Conv, [512, 3, 2]]                   # 6-P4/16
  
  # 添加BiFPN
  - [-1, 1, BiFPNSimple, [512, 512]]             # 7 - BiFPN特征融合
  - [-1, 2, C2f, [512, 512]]                     # 8
  - [-1, 1, Conv, [512, 3, 2]]                   # 9-P5/32
  
  - [-1, 2, C2f, [512, 1024]]                    # 10
  - [-1, 1, SPPF, [1024, 1024]]                  # 11

# 标准head结构 + 微缺陷检测
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 8], 1, Concat, [1]]                    # 13
  - [-1, 2, C2f, [1536, 512]]                    # 14
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 5], 1, Concat, [1]]                    # 16
  - [-1, 2, C2f, [1024, 256]]                    # 17
  
  # P2分支 - 微缺陷检测
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 3], 1, Concat, [1]]                    # 19
  - [-1, 1, MicroDefectHead, [512, 256]]         # 20 - 微缺陷检测头
  - [-1, 2, C2f, [256, 128]]                     # 21
  
  # P1分支 - 超高分辨率
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 22
  - [-1, 1, MicroDefectHead, [128, 64]]          # 23 - P1微缺陷检测
  - [-1, 1, C2f, [64, 64]]                       # 24
  
  # 重建检测层
  - [-1, 1, Conv, [64, 3, 2]]                    # 25
  - [[-1, 21], 1, Concat, [1]]                   # 26
  - [-1, 2, C2f, [192, 128]]                     # 27
  
  - [-1, 1, Conv, [128, 3, 2]]                   # 28
  - [[-1, 17], 1, Concat, [1]]                   # 29
  - [-1, 2, C2f, [384, 256]]                     # 30
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 31
  - [[-1, 14], 1, Concat, [1]]                   # 32
  - [-1, 2, C2f, [768, 512]]                     # 33
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 34
  - [[-1, 11], 1, Concat, [1]]                   # 35
  - [-1, 2, C2f, [1536, 1024]]                   # 36

  # 五尺度检测
  - [[24, 27, 30, 33, 36], 1, Detect, [nc]]      # 37