# Ultimate YOLO11 configuration for surface defect detection
# 集成多种先进模块以最大化MAP性能
# 针对表面缺陷检测场景深度优化

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# 增强的Backbone - 集成多种注意力和先进模块
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 1, SEAttention, []]                     # 2 - SE注意力增强浅层特征
  - [-1, 2, C3k2_Enhanced, [256, False, 0.25, 'se']]  # 3 - 增强C3k2 + SE
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  - [-1, 2, C3k2_Enhanced, [512, False, 0.25, 'cbam']]  # 5 - 增强C3k2 + CBAM
  - [-1, 1, Conv, [512, 3, 2]]                   # 6-P4/16
  - [-1, 2, C3k2_Enhanced, [512, True, 'eca']]   # 7 - 增强C3k2 + ECA
  - [-1, 1, CBAM, []]                            # 8 - CBAM注意力
  - [-1, 1, Conv, [1024, 3, 2]]                  # 9-P5/32
  - [-1, 2, C3k2_Enhanced, [1024, True, 'se']]   # 10 - 增强C3k2 + SE
  - [-1, 1, SPP_Enhanced, [1024, 1024]]          # 11 - 增强SPP
  - [-1, 2, C2PSA, [1024]]                       # 12 - 原始C2PSA保持兼容性

# 增强的Head - 多尺度融合和注意力
head:
  # P4分支
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]                    # cat backbone P4 (带CBAM的特征)
  - [-1, 2, C3k2_Enhanced, [512, False, 'cbam']] # 15 (P4) - 增强特征提取
  - [-1, 1, ECA, []]                             # 16 - ECA注意力

  # P3分支  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]                    # cat backbone P3
  - [-1, 2, C3k2_Enhanced, [256, False, 'se']]   # 19 (P3) - 增强特征提取
  - [-1, 1, CBAM, []]                            # 20 - CBAM注意力

  # P2分支 - 关键的小目标检测
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]                    # cat backbone P2 (带SE的特征)
  - [-1, 2, C3k2_Enhanced, [128, False, 'cbam']] # 23 (P2/4) - 小目标特征增强
  - [-1, 1, SEAttention, []]                     # 24 - SE注意力强化小目标

  # 上采样重建金字塔
  - [-1, 1, Conv, [128, 3, 2]]                   # 25
  - [[-1, 20], 1, Concat, [1]]                   # 26
  - [-1, 2, C3k2_Enhanced, [256, False, 'eca']]  # 27 (P3/8)
  - [-1, 1, FPN_Enhanced, [256]]                 # 28 - FPN增强

  - [-1, 1, Conv, [256, 3, 2]]                   # 29  
  - [[-1, 16], 1, Concat, [1]]                   # 30
  - [-1, 2, C3k2_Enhanced, [512, False, 'se']]   # 31 (P4/16)
  - [-1, 1, ECA, []]                             # 32 - ECA注意力

  - [-1, 1, Conv, [512, 3, 2]]                   # 33
  - [[-1, 12], 1, Concat, [1]]                   # 34
  - [-1, 2, C3k2_Enhanced, [1024, True, 'cbam']] # 35 (P5/32)
  - [-1, 1, CBAM, []]                            # 36 - 最终CBAM增强

  # 多尺度检测头 (P2, P3, P4, P5)
  - [[24, 28, 32, 36], 1, Detect, [nc]]          # 37 - 四尺度检测