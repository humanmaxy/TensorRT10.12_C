# Enhanced YOLO11 with P1/2 + P2/4 output and custom modules for ultra-small defect detection
# 基于P2特征的基础上增加P1特征，显著提升微小目标检测能力
# 集成自定义注意力模块和增强特征提取

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Enhanced Backbone with attention mechanisms
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2 (保留P1特征)
  - [-1, 1, SEAttention, []]                     # 1 - SE注意力增强P1特征
  - [-1, 1, Conv, [128, 3, 2]]                   # 2-P2/4
  - [-1, 1, CoordAtt, []]                        # 3 - Coordinate注意力增强P2特征
  - [-1, 2, C3k2_Enhanced, [256, False, 1, 0.5, 'cbam']]  # 4 - 增强C3k2
  - [-1, 1, Conv, [256, 3, 2]]                   # 5-P3/8
  - [-1, 2, C3k2_Enhanced, [512, False, 1, 0.5, 'se']]    # 6 - 增强C3k2
  - [-1, 1, Conv, [512, 3, 2]]                   # 7-P4/16
  - [-1, 2, C3k2_Enhanced, [512, True, 1, 0.5, 'eca']]    # 8 - 增强C3k2
  - [-1, 1, CBAM, []]                            # 9 - CBAM注意力
  - [-1, 1, Conv, [1024, 3, 2]]                  # 10-P5/32
  - [-1, 2, C3k2_Enhanced, [1024, True, 1, 0.5, 'se']]    # 11 - 增强C3k2
  - [-1, 1, SPP_Enhanced, [1024, 1024]]          # 12 - 增强SPP
  - [-1, 2, C2PSA, [1024]]                       # 13

# Enhanced Head with P1/2 + P2/4 + P3/8 + P4/16 + P5/32 multi-scale detection
head:
  # P4分支开始
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 9], 1, Concat, [1]]                    # 15 cat backbone P4 (带CBAM增强)
  - [-1, 2, C3k2_Enhanced, [512, False, 1, 0.5, 'cbam']] # 16 (P4) - 增强特征提取
  - [-1, 1, ECA, []]                             # 17 - ECA注意力

  # P3分支
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 6], 1, Concat, [1]]                    # 19 cat backbone P3
  - [-1, 2, C3k2_Enhanced, [256, False, 1, 0.5, 'se']]    # 20 (P3) - 增强特征提取
  - [-1, 1, CBAM, []]                            # 21 - CBAM注意力

  # P2分支 - 小目标检测关键层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 22
  - [[-1, 3], 1, Concat, [1]]                    # 23 cat backbone P2 (带CoordAtt增强)
  - [-1, 2, C3k2_Enhanced, [128, False, 1, 0.5, 'cbam']]  # 24 (P2/4) - 小目标特征增强
  - [-1, 1, SEAttention, []]                     # 25 - SE注意力强化

  # P1分支 - 超小目标检测核心层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26
  - [[-1, 1], 1, Concat, [1]]                    # 27 cat backbone P1 (带SE增强)
  - [-1, 2, C3k2_Enhanced, [64, False, 1, 0.5, 'cbam']]   # 28 (P1/2) - 超小目标特征提取
  - [-1, 1, CBAM, []]                            # 29 - 双重注意力机制
  - [-1, 1, SEAttention, []]                     # 30 - 进一步增强微小特征

  # 重建特征金字塔 - 从P1开始逐级融合
  - [-1, 1, Conv, [64, 3, 2]]                    # 31 从P1到P2
  - [[-1, 25], 1, Concat, [1]]                   # 32 融合P2特征
  - [-1, 2, C3k2_Enhanced, [128, False, 1, 0.5, 'eca']]   # 33 (P2/4 融合) 
  - [-1, 1, FPN_Enhanced, [128]]                 # 34 - FPN增强

  - [-1, 1, Conv, [128, 3, 2]]                   # 35 从P2到P3
  - [[-1, 21], 1, Concat, [1]]                   # 36 融合P3特征
  - [-1, 2, C3k2_Enhanced, [256, False, 1, 0.5, 'se']]    # 37 (P3/8 融合)
  - [-1, 1, ECA, []]                             # 38 - ECA注意力

  - [-1, 1, Conv, [256, 3, 2]]                   # 39 从P3到P4
  - [[-1, 17], 1, Concat, [1]]                   # 40 融合P4特征  
  - [-1, 2, C3k2_Enhanced, [512, False, 1, 0.5, 'cbam']]  # 41 (P4/16 融合)
  - [-1, 1, CBAM, []]                            # 42 - CBAM注意力

  - [-1, 1, Conv, [512, 3, 2]]                   # 43 从P4到P5
  - [[-1, 13], 1, Concat, [1]]                   # 44 融合P5特征
  - [-1, 2, C3k2_Enhanced, [1024, True, 1, 0.5, 'se']]    # 45 (P5/32 融合)
  - [-1, 1, SEAttention, []]                     # 46 - 最终SE增强

  # 五尺度检测头 - P1超小, P2小, P3中小, P4中, P5大
  - [[30, 34, 38, 42, 46], 1, Detect, [nc]]      # 47 - 五尺度检测 (P1, P2, P3, P4, P5)