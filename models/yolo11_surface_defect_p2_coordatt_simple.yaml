# Enhanced YOLO11 with P2/4 output and Coordinate Attention for small-defect high-precision detection
# Simple integration of CoordAtt modules to improve spatial feature representation and boost MAP values
# Based on ultralytics/cfg/models/11/yolo11.yaml with custom attention mechanisms

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Standard Backbone with selective Coordinate Attention in key layers
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, CoordAtt, [512]]                     # 5 - Add attention here
  - [-1, 1, Conv, [512, 3, 2]]                   # 6-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 7
  - [-1, 1, CoordAtt, [512]]                     # 8 - Add attention here  
  - [-1, 1, Conv, [1024, 3, 2]]                  # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 10
  - [-1, 1, CoordAtt, [1024]]                    # 11 - Add attention here
  - [-1, 1, SPPF, [1024, 5]]                     # 12
  - [-1, 2, C2PSA, [1024]]                       # 13

# Head with P2/4 output and selective attention
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]                    # cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 16 (P4)
  - [-1, 1, CoordAtt, [512]]                     # 17 - Add attention

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                    # cat backbone P3  
  - [-1, 2, C3k2, [256, False]]                  # 20 (P3)
  - [-1, 1, CoordAtt, [256]]                     # 21 - Add attention

  # P2 branch for small defects with attention
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]                    # cat backbone P2
  - [-1, 2, C3k2, [128, False]]                  # 24 (P2/4 - tiny)
  - [-1, 1, CoordAtt, [128]]                     # 25 - Add attention for tiny objects

  # Re-downsample and fuse back up the pyramid
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]                  # 28 (P3/8 - small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]                  # 31 (P4/16 - medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]                  # 34 (P5/32 - large)

  - [[25, 28, 31, 34], 1, Detect, [nc]]          # Detect(P2, P3, P4, P5)