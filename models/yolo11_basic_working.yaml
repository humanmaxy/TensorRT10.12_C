# Basic Working YOLO11 with Minimal Innovations
# 基础工作版本 - 最小创新模块集成
# 确保稳定运行，逐步验证功能

nc: 5
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.25, 1.25, 512]

# 基于标准YOLO11n的backbone，谨慎添加创新
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  - [-1, 2, C2f, [128, 256]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8
  - [-1, 2, C2f, [256, 512]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]    # 5-P4/16
  - [-1, 2, C2f, [512, 512]]      # 6
  - [-1, 1, Conv, [512, 3, 2]]    # 7-P5/32
  - [-1, 2, C2f, [512, 1024]]     # 8
  - [-1, 1, SPPF, [1024, 1024]]   # 9

# 标准head + 微缺陷注意力
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 cat backbone P4
  - [-1, 2, C2f, [1536, 512]]                   # 12 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14 cat backbone P3
  - [-1, 2, C2f, [1024, 256]]                   # 15 (P3/8)
  
  # 添加P2层用于小目标检测
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 2], 1, Concat, [1]]                   # 17 cat backbone P2
  - [-1, 2, C2f, [512, 128]]                    # 18 (P2/4) - 小目标层
  - [-1, 1, MicroDefectAttention, [128]]        # 19 - 微缺陷注意力
  
  - [-1, 1, Conv, [128, 3, 2]]                  # 20
  - [[-1, 15], 1, Concat, [1]]                  # 21
  - [-1, 2, C2f, [384, 256]]                    # 22 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                  # 23
  - [[-1, 12], 1, Concat, [1]]                  # 24
  - [-1, 2, C2f, [768, 512]]                    # 25 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                  # 26
  - [[-1, 9], 1, Concat, [1]]                   # 27
  - [-1, 2, C2f, [1536, 1024]]                  # 28 (P5/32)

  # 四尺度检测头（包含P2小目标检测）
  - [[19, 22, 25, 28], 1, Detect, [nc]]         # 29