# YOLO11 with P2/4 output for small-defect high-precision detection
# Based on ultralytics/cfg/models/11/yolo11.yaml and extended head

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10

# Head with P2/4 output
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # cat backbone P4
  - [-1, 2, C3k2_SE, [512, False]]      # 13 (P4) with SE

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # cat backbone P3
  - [-1, 2, C3k2_SE, [256, False]]      # 16 (P3) with SE

  # Added P2 branch for small defects
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]          # cat backbone P2
  - [-1, 3, C3k2_SE, [160, False]]      # 19 (P2/4 - tiny, widened and deeper) with SE

  # Re-downsample and fuse back up the pyramid
  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 3, C3k2_SE, [320, False]]      # 22 (P3/8 - small, wider) with SE

  - [-1, 1, Conv, [320, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2_SE, [640, False]]      # 25 (P4/16 - medium, wider) with SE

  - [-1, 1, Conv, [640, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]        # 28 (P5/32 - large)

  - [[19, 22, 25, 28], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)