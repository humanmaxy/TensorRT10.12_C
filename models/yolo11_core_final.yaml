# YOLO11 Core Final - 最终核心版本
# 实现四大功能，避免所有兼容性问题
# 基于标准YOLO11架构，确保稳定运行

nc: 5  # 缺陷类别数
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.25, 1.25, 512]

# 增强backbone - 四大功能集成
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  
  # Stage 1: 小目标增强 - 微缺陷检测准备
  - [-1, 1, SmallObjectAttention, [128]]         # 2 - 小目标注意力
  - [-1, 2, C2f, [128, 256]]                     # 3 - 标准C2f
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  
  # Stage 2: 中等目标 - 蛇形卷积集成
  - [-1, 2, EnhancedC2f, [256, 512]]             # 5 - 增强C2f（功能2：蛇形卷积）
  - [-1, 1, Conv, [512, 3, 2]]                   # 6-P4/16
  
  # Stage 3: 大目标 - BiFPN特征融合
  - [-1, 1, BiFPNSimple, [512, 512]]             # 7 - 简化BiFPN（功能3）
  - [-1, 2, C2f, [512, 512]]                     # 8 - 标准C2f
  - [-1, 1, Conv, [512, 3, 2]]                   # 9-P5/32
  
  # Stage 4: 高级特征
  - [-1, 2, C2f, [512, 1024]]                    # 10
  - [-1, 1, SPPF, [1024, 1024]]                  # 11

# 增强head - 专用微缺陷检测（功能1）
head:
  # 标准自顶向下路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 8], 1, Concat, [1]]                    # 13 - cat P4 (1024+512=1536)
  - [-1, 2, C2f, [1536, 512]]                    # 14 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15  
  - [[-1, 5], 1, Concat, [1]]                    # 16 - cat P3 (512+512=1024)
  - [-1, 2, C2f, [1024, 256]]                    # 17 (P3/8)
  
  # P2分支 - 专用微缺陷检测头
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 3], 1, Concat, [1]]                    # 19 - cat P2 (256+256=512)
  - [-1, 1, MicroDefectHead, [512, 256]]         # 20 - 专用微缺陷检测头（功能1）
  - [-1, 2, C2f, [256, 128]]                     # 21 (P2/4)
  
  # P1分支 - 超高分辨率微缺陷检测（15微米级别）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 22 - P1/2层
  - [-1, 1, MicroDefectHead, [128, 64]]          # 23 - P1层微缺陷检测（功能1）
  - [-1, 1, C2f, [64, 64]]                       # 24 (P1/2) - 保持通道数
  
  # 自底向上路径重建
  - [-1, 1, Conv, [64, 3, 2]]                    # 25 - P1 to P2
  - [[-1, 21], 1, Concat, [1]]                   # 26 - (64+128=192)
  - [-1, 2, C2f, [192, 128]]                     # 27 (P2/4)
  
  - [-1, 1, Conv, [128, 3, 2]]                   # 28 - P2 to P3
  - [[-1, 17], 1, Concat, [1]]                   # 29 - (128+256=384)
  - [-1, 2, C2f, [384, 256]]                     # 30 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 31 - P3 to P4
  - [[-1, 14], 1, Concat, [1]]                   # 32 - (256+512=768)
  - [-1, 2, C2f, [768, 512]]                     # 33 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 34 - P4 to P5
  - [[-1, 11], 1, Concat, [1]]                   # 35 - (512+1024=1536)
  - [-1, 2, C2f, [1536, 1024]]                   # 36 (P5/32)

  # 五尺度检测头 - 包含P1超高分辨率检测
  - [[24, 27, 30, 33, 36], 1, Detect, [nc]]      # 37 - 五尺度检测