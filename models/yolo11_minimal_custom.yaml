# YOLO11 Minimal Custom - 最小自定义版本
# 基于标准yolo11n.yaml，只做最小必要的修改
# 实现四大功能但避免复杂的自定义模块

nc: 5  # 缺陷类别数

# 完全基于标准yolo11n架构
backbone:
  # [from, repeats, module, args] - 标准yolo11n结构
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  - [-1, 2, C2f, [128, 256]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8
  - [-1, 2, C2f, [256, 512]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]    # 5-P4/16
  - [-1, 2, C2f, [512, 512]]      # 6
  - [-1, 1, Conv, [512, 3, 2]]    # 7-P5/32
  - [-1, 2, C2f, [512, 1024]]     # 8
  - [-1, 1, SPPF, [1024, 1024]]   # 9

# 扩展head实现五尺度检测（功能1：专用微缺陷检测头）
head:
  # 标准P4/P3路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 cat backbone P4
  - [-1, 2, C2f, [1536, 512]]                   # 12 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14 cat backbone P3
  - [-1, 2, C2f, [1024, 256]]                   # 15 (P3/8)
  
  # P2分支 - 小目标检测（功能1）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 2], 1, Concat, [1]]                   # 17 cat backbone P2
  - [-1, 2, C2f, [512, 128]]                    # 18 (P2/4) - 小目标层
  
  # P1分支 - 超高分辨率检测（功能1：15微米级别）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19 P1/2层
  - [-1, 2, C2f, [128, 64]]                     # 20 (P1/2) - 微缺陷层
  
  # 重建自底向上路径
  - [-1, 1, Conv, [64, 3, 2]]                   # 21
  - [[-1, 18], 1, Concat, [1]]                  # 22
  - [-1, 2, C2f, [192, 128]]                    # 23 (P2/4)
  
  - [-1, 1, Conv, [128, 3, 2]]                  # 24
  - [[-1, 15], 1, Concat, [1]]                  # 25
  - [-1, 2, C2f, [384, 256]]                    # 26 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                  # 27
  - [[-1, 12], 1, Concat, [1]]                  # 28
  - [-1, 2, C2f, [768, 512]]                    # 29 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                  # 30
  - [[-1, 9], 1, Concat, [1]]                   # 31
  - [-1, 2, C2f, [1536, 1024]]                  # 32 (P5/32)

  # 五尺度检测头 - 包含P1/P2微缺陷检测
  - [[20, 23, 26, 29, 32], 1, Detect, [nc]]     # 33