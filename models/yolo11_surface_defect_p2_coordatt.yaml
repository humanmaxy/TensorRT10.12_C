# Enhanced YOLO11 with P2/4 output and Coordinate Attention for small-defect high-precision detection
# Integrates CoordAtt modules to improve spatial feature representation and boost MAP values
# Based on ultralytics/cfg/models/11/yolo11.yaml with custom attention mechanisms

# Parameters
nc: 80  # number of classes (will be overridden by dataset)
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Enhanced Backbone with Coordinate Attention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, EnhancedConv, [128, 3, 2]]  # 1-P2/4 with CoordAtt
  - [-1, 2, C3k2_CoordAtt, [256, False, 0.25]]   # 2 - Enhanced with attention
  - [-1, 1, EnhancedConv, [256, 3, 2]]  # 3-P3/8 with CoordAtt
  - [-1, 2, C3k2_CoordAtt, [512, False, 0.25]]   # 4 - Enhanced with attention
  - [-1, 1, EnhancedConv, [512, 3, 2]]  # 5-P4/16 with CoordAtt  
  - [-1, 2, C3k2_CoordAtt, [512, True]]          # 6 - Enhanced with attention
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2_CoordAtt, [1024, True]]         # 8 - Enhanced with attention
  - [-1, 1, SPPF, [1024, 5]]                     # 9
  - [-1, 2, C2PSA, [1024]]                       # 10

# Enhanced Head with P2/4 output and Coordinate Attention
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                    # cat backbone P4
  - [-1, 2, C3k2_CoordAtt, [512, False]]         # 13 (P4) - Enhanced with attention

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                    # cat backbone P3  
  - [-1, 2, C3k2_CoordAtt, [256, False]]         # 16 (P3) - Enhanced with attention

  # Enhanced P2 branch for small defects with coordinate attention
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]                    # cat backbone P2
  - [-1, 2, C3k2_CoordAtt, [128, False]]         # 19 (P2/4 - tiny) - Enhanced with attention

  # Re-downsample and fuse back up the pyramid with attention
  - [-1, 1, EnhancedConv, [128, 3, 2]]  # 20 with CoordAtt
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2_CoordAtt, [256, False]]         # 22 (P3/8 - small) - Enhanced with attention

  - [-1, 1, EnhancedConv, [256, 3, 2]]  # 23 with CoordAtt
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2_CoordAtt, [512, False]]         # 25 (P4/16 - medium) - Enhanced with attention

  - [-1, 1, Conv, [512, 3, 2]]                   # 26
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2_CoordAtt, [1024, True]]         # 28 (P5/32 - large) - Enhanced with attention

  - [[19, 22, 25, 28], 1, Detect, [nc]]          # Detect(P2, P3, P4, P5)