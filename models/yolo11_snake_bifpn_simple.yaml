# YOLO11 with Snake Deformable Conv + BiFPN - Simple Version
# 集成蛇形可变形卷积和BiFPN的YOLO11配置 - 简化版本
# 避免复杂参数，确保稳定运行

# Parameters
nc: 5  # 缺陷类别数
scales:  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.25, 1.25, 512]

# 简化主干网络 - 只使用核心创新模块
backbone:
  # [from, repeats, module, args]
  
  # Stem - 基础特征提取
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  
  # Stage 1: 小目标特征增强 - 蛇形卷积
  - [-1, 1, SEAttention, []]                     # 2 - SE注意力
  - [-1, 2, C3k2_SnakeDeformable, [128, 256]]    # 3 - 蛇形可变形卷积
  - [-1, 1, Conv, [256, 3, 2]]                   # 4-P3/8
  
  # Stage 2: 中等目标 - BiFPN融合
  - [-1, 1, BiFPNBlock, [256, 256]]              # 5 - BiFPN块
  - [-1, 2, C3k2, [256, 512]]                    # 6 - 标准C3k2（避免复杂参数）
  - [-1, 1, Conv, [512, 3, 2]]                   # 7-P4/16
  
  # Stage 3: 大目标 - 蛇形+BiFPN组合
  - [-1, 1, TripleBiFPN, [512, 512]]             # 8 - 三阶BiFPN
  - [-1, 2, C3k2_SnakeDeformable, [512, 512]]    # 9 - 蛇形增强
  - [-1, 1, CBAM, []]                            # 10 - CBAM注意力
  - [-1, 1, Conv, [512, 3, 2]]                   # 11-P5/32
  
  # Stage 4: 高级特征融合
  - [-1, 2, C3k2, [512, 1024]]                   # 12 - 标准C3k2
  - [-1, 1, SPP_Enhanced, [1024, 1024]]          # 13 - 增强SPP
  - [-1, 1, MultiScaleBiFPN, [[1024], 1024]]     # 14 - 多尺度BiFPN
  - [-1, 2, C2PSA, [1024]]                       # 15 - PSA注意力

# 简化检测头 - 使用标准结构
head:
  # 自顶向下路径
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 10], 1, Concat, [1]]                   # 17 - cat P4 (1024 + 512 = 1536)
  - [-1, 2, C3k2_SnakeDeformable, [1536, 512]]   # 18 (P4) - 蛇形增强
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 19
  - [[-1, 6], 1, Concat, [1]]                    # 20 - cat P3 (512 + 512 = 1024)
  - [-1, 2, C3k2, [1024, 256]]                   # 21 (P3) - 标准C3k2
  
  # P2分支 - 微小目标关键层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 22
  - [[-1, 3], 1, Concat, [1]]                    # 23 - cat P2 (256 + 256 = 512)
  - [-1, 2, C3k2_SnakeDeformable, [512, 128]]    # 24 (P2/4) - 蛇形微目标增强
  - [-1, 1, MicroDefectAttention, [128]]         # 25 - 微缺陷注意力
  
  # 自底向上路径重建
  - [-1, 1, Conv, [128, 3, 2]]                   # 26
  - [[-1, 21], 1, Concat, [1]]                   # 27 - (128 + 256 = 384)
  - [-1, 2, C3k2, [384, 256]]                    # 28 (P3/8) - 标准C3k2
  
  - [-1, 1, Conv, [256, 3, 2]]                   # 29
  - [[-1, 18], 1, Concat, [1]]                   # 30 - (256 + 512 = 768)
  - [-1, 2, C3k2_SnakeDeformable, [768, 512]]    # 31 (P4/16) - 蛇形增强
  
  - [-1, 1, Conv, [512, 3, 2]]                   # 32
  - [[-1, 15], 1, Concat, [1]]                   # 33 - (512 + 1024 = 1536)
  - [-1, 2, C3k2, [1536, 1024]]                  # 34 (P5/32) - 标准C3k2

  # 四尺度检测头 - 标准YOLO检测头
  - [[25, 28, 31, 34], 1, Detect, [nc]]          # 35 - 标准检测头