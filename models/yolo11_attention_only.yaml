# YOLO11 with Attention Only - Ultra Safe Version
# 只使用注意力机制的超安全版本
# 避免复杂的自定义卷积模块

nc: 5
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.25, 1.25, 512]

# 标准backbone + 注意力增强
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  - [-1, 1, SEAttention, []]      # 2 - SE注意力（小目标增强）
  - [-1, 2, C2f, [128, 256]]      # 3
  - [-1, 1, Conv, [256, 3, 2]]    # 4-P3/8
  - [-1, 1, CBAM, []]             # 5 - CBAM注意力（中等目标）
  - [-1, 2, C2f, [256, 512]]      # 6
  - [-1, 1, Conv, [512, 3, 2]]    # 7-P4/16
  - [-1, 1, ECA, []]              # 8 - ECA注意力（大目标）
  - [-1, 2, C2f, [512, 512]]      # 9
  - [-1, 1, Conv, [512, 3, 2]]    # 10-P5/32
  - [-1, 2, C2f, [512, 1024]]     # 11
  - [-1, 1, SPPF, [1024, 1024]]   # 12

# 标准head + 微缺陷注意力
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 9], 1, Concat, [1]]                   # 14 cat backbone P4
  - [-1, 2, C2f, [1536, 512]]                   # 15 (P4/16)
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 6], 1, Concat, [1]]                   # 17 cat backbone P3
  - [-1, 2, C2f, [1024, 256]]                   # 18 (P3/8)
  
  # P2层 - 小目标检测 + 微缺陷注意力
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19
  - [[-1, 3], 1, Concat, [1]]                   # 20 cat backbone P2
  - [-1, 2, C2f, [512, 128]]                    # 21 (P2/4)
  - [-1, 1, MicroDefectAttention, [128]]        # 22 - 微缺陷注意力
  
  - [-1, 1, Conv, [128, 3, 2]]                  # 23
  - [[-1, 18], 1, Concat, [1]]                  # 24
  - [-1, 2, C2f, [384, 256]]                    # 25 (P3/8)
  
  - [-1, 1, Conv, [256, 3, 2]]                  # 26
  - [[-1, 15], 1, Concat, [1]]                  # 27
  - [-1, 2, C2f, [768, 512]]                    # 28 (P4/16)
  
  - [-1, 1, Conv, [512, 3, 2]]                  # 29
  - [[-1, 12], 1, Concat, [1]]                  # 30
  - [-1, 2, C2f, [1536, 1024]]                  # 31 (P5/32)

  # 四尺度检测头（包含P2小目标检测）
  - [[22, 25, 28, 31], 1, Detect, [nc]]         # 32